name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, milestone-3a-integration]

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-repro.txt

      - name: Install OCR system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr fonts-dejavu-core

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Python compile check
        run: python -m compileall -q backend tests tools

      - name: M3A targeted arbitration tests
        run: pytest -q tests/test_m3a_arbitration.py

      - name: Backend and OCR regression tests
        run: pytest -q

      - name: OCR benchmark smoke run
        run: python tests/ocr_benchmark.py --output /tmp/ocr-benchmark.json --kind ci-regression --git-commit "$GITHUB_SHA"

      - name: Reproduce restricted recognizer model
        run: |
          EXPECTED_HASH="$(cat experiments/m2b-hog-nn-v1/model_contract_hash.txt)"
          python tools/train_restricted_recognizer.py --output-model /tmp/restricted_hog_nn_v1.npz --experiment-dir /tmp/m2b-repro --expected-hash "$EXPECTED_HASH"
          python tools/evaluate_restricted_recognizer.py --model /tmp/restricted_hog_nn_v1.npz --output /tmp/m2b-benchmark.json
          python - <<'PY'
          import json
          from pathlib import Path
          reproduced = json.loads(Path("/tmp/m2b-benchmark.json").read_text())
          committed = json.loads(Path("artifacts/benchmarks/m2b_recognizer.json").read_text())
          if reproduced.get("model_contract_sha256") != committed.get("model_contract_sha256"):
              raise SystemExit("M2B model contract did not reproduce exactly.")
          reproduced = dict(reproduced)
          committed = dict(committed)
          reproduced.pop("model_sha256", None)
          committed.pop("model_sha256", None)
          if reproduced != committed:
              raise SystemExit("M2B held-out behavior did not reproduce exactly.")
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend production build
        working-directory: frontend
        run: |
          npm ci
          npm run build
